services:
  telefam-bot:
    image: ghcr.io/sl0rd/telefam-bot:latest
    container_name: telefam-bot
    restart: unless-stopped
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      OWM_API_KEY: ${OWM_API_KEY}
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY}
      LASTFM_API_KEY: ${LASTFM_API_KEY}
      ADMIN_IDS: ${ADMIN_IDS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-SL0RD}
      LASTFM_DATA_FILE: /data/lastfm_users.json
    volumes:
      - bot-chatlogs:/app/chatlogs
      - bot-data:/data

volumes:
  bot-chatlogs:
  bot-data:
