name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sl0rd/telefam-bot

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Redeploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "Deploy secrets not fully configured - skipping redeploy (image was still pushed)"
            exit 0
          fi

          install -dm700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Accept either a raw keyscan line ("<host> ssh-ed25519 AAAA...")
          # or a bare "ssh-ed25519 AAAA..." pair; always rebind it to the
          # exact hostname we connect with so lookups can't miss.
          KEY_FIELDS="$(printf '%s\n' "$DEPLOY_HOST_KEY" \
            | tr -d '\r' \
            | grep -E '(^| )(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+) ' \
            | head -n1 \
            | awk '{print $(NF-1), $NF}')"
          if [ -z "$KEY_FIELDS" ]; then
            echo "::error::DEPLOY_HOST_KEY contains no recognizable host key line - re-run: ssh-keyscan -t ed25519 <host>"
            exit 1
          fi
          printf '%s %s\n' "$DEPLOY_HOST" "$KEY_FIELDS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "Pinned host key for $DEPLOY_HOST:"
          ssh-keygen -lf ~/.ssh/known_hosts

          # No remote command: the server's forced authorized_keys entry runs
          # deploy.sh, so this session can never execute anything else.
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o IdentitiesOnly=yes \
              "deploy@$DEPLOY_HOST"
