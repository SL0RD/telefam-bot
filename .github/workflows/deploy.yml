name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sl0rd/telefam-bot

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Redeploy via Portainer webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          PORTAINER_HOOK_SECRET: ${{ secrets.PORTAINER_HOOK_SECRET }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ] || [ -z "$PORTAINER_HOOK_SECRET" ]; then
            echo "PORTAINER_WEBHOOK_URL or PORTAINER_HOOK_SECRET not set - skipping redeploy (image was still pushed)"
            exit 0
          fi
          curl -fsS --max-time 30 -X POST \
            -H "X-Hook-Secret: $PORTAINER_HOOK_SECRET" \
            "$PORTAINER_WEBHOOK_URL"
