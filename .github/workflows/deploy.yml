name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sl0rd/telefam-bot

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Redeploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "Deploy secrets not fully configured - skipping redeploy (image was still pushed)"
            exit 0
          fi

          install -dm700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Accept raw keyscan output ("<host> ssh-ed25519 AAAA..."), bare
          # "ssh-ed25519 AAAA...", or full .pub lines with trailing comments;
          # always rebind the key to the exact hostname we connect with.
          LINE="$(printf '%s\n' "$DEPLOY_HOST_KEY" | tr -d '\r' \
            | grep -m1 -E '(^|[[:space:]])(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+)([[:space:]]|$)' || true)"
          KEYTYPE=""
          BASE64=""
          if [ -n "$LINE" ]; then
            PREV=""
            for tok in $LINE; do
              if [ -n "$PREV" ]; then
                KEYTYPE="$PREV"
                BASE64="$tok"
                break
              fi
              case "$tok" in
                ssh-ed25519|ssh-rsa|ecdsa-sha2-*) PREV="$tok" ;;
              esac
            done
          fi
          if [ -z "$BASE64" ]; then
            echo "::error::DEPLOY_HOST_KEY contains no usable '<keytype> <base64>' pair - expected e.g.: ssh-keyscan -t ed25519 <host> | grep -v '^#' (a private key or fingerprint won't work)"
            exit 1
          fi
          printf '%s %s %s\n' "$DEPLOY_HOST" "$KEYTYPE" "$BASE64" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "Pinned host key for $DEPLOY_HOST:"
          ssh-keygen -lf ~/.ssh/known_hosts

          # No remote command: the server's forced authorized_keys entry runs
          # deploy.sh, so this session can never execute anything else.
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o IdentitiesOnly=yes \
              "deploy@$DEPLOY_HOST"
