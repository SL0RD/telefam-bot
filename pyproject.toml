[project]
name = "telefam-bot"
version = "1.0.0"
description = "A Telegram bot for family group chats"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["example.conf.py", "config.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
